default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.7
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.23
    hooks:
      - id: uv-lock
        name: uv-lock root workspace
      - id: uv-sync
        name: uv-sync root workspace
        args: [--locked, --all-packages, --all-extras, --all-groups]
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run --no-sync basedpyright
        language: system
        pass_filenames: false
      - id: active-listener-ui-gnome
        name: active-listener-ui-gnome
        entry: bash -c "cd packages/active-listener-ui-gnome && pnpm run typecheck && pnpm run validate:active-listener-log-command && pnpm run validate:active-listener-service-error && pnpm run validate:recording-menu-control && pnpm run validate:transcript-attributes"
        language: system
        pass_filenames: false
