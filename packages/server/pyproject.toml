[project]
name = "eavesdrop-server"
version = "0.0.0"
description = "Real-time audio transcription server with WebSocket-based speech-to-text services"
authors = [{name = "shyndman", email = "scotty.hyndman@gmail.com"}]
requires-python = ">=3.12.3,<3.13"
dependencies = [
  "eavesdrop-common",
  "eavesdrop-wire",
  "langfuse>=4.5.1",
  "netifaces>=0.11.0",
  "numpy<2",
  "psutil",
  "pydantic>=2",
  "pyyaml>=6.0",
  "soundfile",
  "structlog>=25.4.0",
  "websocket-client>=1.8.0",
  "websockets>=13.0",
]
license = {text = "MIT"}


[project.urls]
repository = "https://github.com/shyndman/eavesdrop"
"Bug Tracker" = "https://github.com/shyndman/eavesdrop/issues"

[project.scripts]
eavesdrop-server = "eavesdrop.server.__main__:main"

[project.optional-dependencies]
transcription = [
    "huggingface-hub>=0.36,<2",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "silero-vad[onnx-cpu]>=6.2,<7",
    "torch==2.9.1",
    "torchaudio==2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eavesdrop"]

[dependency-groups]
dev = [
    "basedpyright>=1.35.0",
    "pyfakefs>=5.9.3",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.basedpyright]
include = ["src", "tests"]
ignore = ["**/.venv"]
extraPaths = ["../wire/src", "../common/src"]
defineConstant = {DEBUG = true}
pythonPlatform = "Linux"
deprecateTypingAliases = true

# Diagnostic rules — explicitly configured based on project review
reportMissingImports = "error"
reportDeprecated = "information"
reportUnknownMemberType = "error"           # Keep: catches type info loss from untyped libs
reportUnannotatedClassAttribute = "error"   # Keep: requires explicit types on class attributes
reportUnknownVariableType = "error"         # Keep: fix via local stubs + typed Pydantic validators

executionEnvironments = [
  { root = "tests", reportAny = "none", reportExplicitAny = "none", reportImplicitOverride = "none", reportMissingTypeStubs = "none", reportMissingParameterType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportUnannotatedClassAttribute = "none", reportUnnecessaryCast = "none", reportUnknownArgumentType = "none", reportUnknownLambdaType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none", reportUnusedCallResult = "none", reportUnusedImport = "none", reportUnusedParameter = "none" },
  { root = "src" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 2

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["eavesdrop"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
eavesdrop-wire = { workspace = true }
eavesdrop-common = { workspace = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
