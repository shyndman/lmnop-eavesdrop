version: '3'

vars:
  DEFAULT_ACCELERATOR: '{{default "cpu" .ACCELERATOR}}'

tasks:
  run-active-listener:
    desc: Start the active-listener workstation dictation CLI
    dotenv: ['.env']
    dir: .
    cmds:
      - uv sync --all-extras --all-groups --project packages/active-listener
      - uv run --project packages/active-listener active-listener --config-path packages/active-listener/config.yaml {{.CLI_ARGS}}

  install-active-listener-service:
    desc: Install or update the active-listener user systemd service
    dir: .
    cmds:
      - uv sync --all-extras --all-groups --project packages/active-listener
      - |
        .venv/bin/python - <<'PY'
        import shutil
        import sys
        from pathlib import Path

        import yaml

        repo_root = Path.cwd()
        unit_template = repo_root / "packages/active-listener/systemd/active-listener.service.in"
        unit_destination = Path.home() / ".config/systemd/user/active-listener.service"
        config_destination = Path.home() / ".config/eavesdrop/active-listener.yaml"
        prompt_destination = Path.home() / ".config/eavesdrop/active-listener.rewrite.system.md"

        package_dir = repo_root / "packages/active-listener"
        uv_bin = shutil.which("uv")
        sys.path.insert(0, str(package_dir / "src"))

        from active_listener.config.loader import (
          load_active_listener_config_file,
          normalize_active_listener_config_paths,
        )

        if uv_bin is None:
          raise SystemExit("uv not found on PATH; cannot build service unit")

        def write_normalized_config(*, source_config: Path, destination_config: Path) -> None:
          source_config_data = load_active_listener_config_file(source_config)
          normalized_config = normalize_active_listener_config_paths(
            source_config_data,
            config_dir=source_config.parent,
          )
          destination_config.write_text(
            yaml.safe_dump(normalized_config, sort_keys=False),
            encoding="utf-8",
          )

        unit_text = unit_template.read_text()
        unit_text = unit_text.replace("@REPO_ROOT@", str(repo_root))
        unit_text = unit_text.replace("@UV_BIN@", uv_bin)
        unit_destination.parent.mkdir(parents=True, exist_ok=True)
        unit_destination.write_text(unit_text)

        config_destination.parent.mkdir(parents=True, exist_ok=True)
        if config_destination.is_symlink():
          source_config = config_destination.resolve()
          config_destination.unlink()
          write_normalized_config(
            source_config=source_config,
            destination_config=config_destination,
          )
        elif config_destination.exists():
          write_normalized_config(
            source_config=config_destination,
            destination_config=config_destination,
          )
        else:
          source_config = None
          for source in (
            package_dir / "config.yaml",
            package_dir / "config.sample.yaml",
          ):
            if source.exists():
              source_config = source
              break
          if source_config is None:
            raise SystemExit("No active-listener config source found to seed the XDG config path")

          write_normalized_config(
            source_config=source_config,
            destination_config=config_destination,
          )

        print(f"Installed {unit_destination}")
        print(f"Using config path {config_destination}")
        if prompt_destination.exists():
          print(f"Prompt override path {prompt_destination}")
        PY
      - systemctl --user daemon-reload
      - systemctl --user enable active-listener.service
      - |
        if systemctl --user is-active --quiet active-listener.service; then
          systemctl --user restart active-listener.service
        else
          systemctl --user start active-listener.service
        fi
      - |
        deadline=$((SECONDS + 60))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if systemctl --user is-active --quiet active-listener.service; then
            sleep 10
            if systemctl --user is-active --quiet active-listener.service; then
              systemctl --user status active-listener.service --no-pager
              exit 0
            fi
          fi
          sleep 2
        done
        systemctl --user status active-listener.service --no-pager
        journalctl --user -u active-listener.service -n 100 --no-pager
        exit 1

  uninstall-active-listener-service:
    desc: Stop, disable, and remove the active-listener user systemd service
    dir: .
    cmds:
      - systemctl --user disable --now active-listener.service || true
      - rm -f "$HOME/.config/systemd/user/active-listener.service"
      - systemctl --user daemon-reload
      - |
        if systemctl --user is-enabled active-listener.service >/dev/null 2>&1; then
          echo "active-listener.service is still enabled"
          exit 1
        fi
      - |
        if systemctl --user is-active --quiet active-listener.service; then
          systemctl --user status active-listener.service --no-pager
          exit 1
        fi

  follow-active-listener-service-logs:
    desc: follow the active listener logs, formatted without journal cruft
    cmds: 
      - journalctl --user -u active-listener.service -o cat --follow

  prepare-active-listener-ui-gnome:
    desc: Install active-listener-ui-gnome dependencies
    dir: packages/active-listener-ui-gnome
    cmds:
      - pnpm install --frozen-lockfile

  build-active-listener-ui-gnome:
    desc: Build the active-listener-ui-gnome extension bundle
    deps: [prepare-active-listener-ui-gnome]
    dir: packages/active-listener-ui-gnome
    cmds:
      - pnpm run build

  install-active-listener-ui-gnome:
    desc: Build and install the active-listener-ui-gnome GNOME Shell extension
    deps: [build-active-listener-ui-gnome]
    dir: packages/active-listener-ui-gnome
    cmds:
      - gnome-extensions install --force .out/eavesdrop@shyndman.ca.zip

  test-active-listener-ui-gnome:
    desc: Launch the active-listener-ui-gnome nested Wayland GNOME Shell test session
    deps: [prepare-active-listener-ui-gnome]
    dir: packages/active-listener-ui-gnome
    cmds:
      - |
        journalctl --user --follow --output cat --since now \
          | grep --line-buffered 'Active Listener' &
        journal_tail_pid=$!
        trap 'kill "$journal_tail_pid"' EXIT
        pnpm run wayland:test

  prepare-client-lib:
    desc: Install client library dependencies
    dir: packages/client
    cmds:
      - uv sync --all-extras --all-groups

  transcribe-file:
    desc: Transcribe a local audio file (set audio_file=/path/to/audio.wav)
    deps: [prepare-client-lib]
    dir: packages/client
    vars:
      host: '{{default "localhost" .host}}'
      port: '{{default "9090" .port}}'
    requires:
      vars: [audio_file]
    cmds:
      - uv run python -m eavesdrop.client.transcribe_file_cli --audio-file "{{.audio_file}}" --host "{{.host}}" --port {{.port}} {{.CLI_ARGS}}

  run-mic-client:
    desc: Start microphone transcription client
    deps: [prepare-client-lib]
    dir: packages/client
    vars:
      host: '{{default "localhost" .host}}'
      port: '{{default "9090" .port}}'
      audio_device: '{{default "default" .audio_device}}'
    cmds:
      - uv run python examples/simple_transcriber.py --server "{{.host}}:{{.port}}" --audio-device "{{.audio_device}}" {{.CLI_ARGS}}

  prepare-server:
    desc: Install the server and opt-in Parakeet transcription dependencies
    dir: .
    cmds:
      - uv sync --package eavesdrop-server --extra transcription

  typecheck:
    desc: Run the workspace type checker
    dir: .
    cmds:
      - uv run basedpyright

  typecheck-server:
    desc: Run the server type checker with optional transcription dependencies
    dir: packages/server
    cmds:
      - uv run --extra transcription basedpyright

  list-gpus:
    desc: Print GPU names as reported by PyTorch on the current machine
    cmds:
      - uv run --no-project "$(command -v python3)" -c 'import json, torch; print(json.dumps([torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]))'

  run-server:
    desc: Start the transcription server with local config
    deps: [prepare-server]
    dotenv: ['.env']
    dir: packages/server
    cmds:
      - uv run --extra transcription eavesdrop-server --config config.yaml

  build-cpu-base-image:
    desc: Build the CPU PyTorch base image
    dir: .
    vars:
      CPU_BASE_IMAGE: '{{default "eavesdrop-cpu-base" .CPU_BASE_IMAGE}}'
    cmds:
      - docker build --progress=plain -f packages/server/docker/Dockerfile.cpu-base -t {{.CPU_BASE_IMAGE}} .

  build-cuda-base-image:
    desc: Build the NVIDIA CUDA PyTorch base image
    dir: .
    vars:
      CUDA_BASE_IMAGE: '{{default "eavesdrop-cuda-base" .CUDA_BASE_IMAGE}}'
    cmds:
      - docker build --progress=plain -f packages/server/docker/Dockerfile.cuda-base -t {{.CUDA_BASE_IMAGE}} .

  build-rocm-base-image:
    desc: Build the experimental AMD ROCm PyTorch base image
    dir: .
    vars:
      ROCM_BASE_IMAGE: '{{default "eavesdrop-rocm-base" .ROCM_BASE_IMAGE}}'
    cmds:
      - docker build --progress=plain -f packages/server/docker/Dockerfile.rocm-base -t {{.ROCM_BASE_IMAGE}} .

  build-server-image:
    desc: Build the Parakeet server (ACCELERATOR=cpu, cuda, or rocm; default cpu)
    dir: .
    vars:
      ACCELERATOR: '{{.DEFAULT_ACCELERATOR}}'
      SERVER_IMAGE: '{{default "ghcr.io/shyndman/lmnop-eavesdrop:latest" .SERVER_IMAGE}}'
      CPU_BASE_IMAGE: '{{default "eavesdrop-cpu-base" .CPU_BASE_IMAGE}}'
      CUDA_BASE_IMAGE: '{{default "eavesdrop-cuda-base" .CUDA_BASE_IMAGE}}'
      ROCM_BASE_IMAGE: '{{default "eavesdrop-rocm-base" .ROCM_BASE_IMAGE}}'
      BASE_IMAGE: '{{if eq .ACCELERATOR "cuda"}}{{.CUDA_BASE_IMAGE}}{{else if eq .ACCELERATOR "rocm"}}{{.ROCM_BASE_IMAGE}}{{else}}{{.CPU_BASE_IMAGE}}{{end}}'
      SKIP_CACHE: '{{default "false" .SKIP_CACHE}}'
    preconditions:
      - sh: 'test "{{.ACCELERATOR}}" = cpu || test "{{.ACCELERATOR}}" = cuda || test "{{.ACCELERATOR}}" = rocm'
        msg: 'ACCELERATOR must be cpu, cuda, or rocm'
    cmds:
      - task: build-{{.ACCELERATOR}}-base-image
      - docker build {{if eq .SKIP_CACHE "true"}}--no-cache {{end}}--progress=plain
          -f packages/server/docker/Dockerfile
          --build-arg BASE_IMAGE={{.BASE_IMAGE}}
          --label io.eavesdrop.accelerator={{.ACCELERATOR}}
          -t {{.SERVER_IMAGE}} .

  run-server-image:
    desc: Run the server container (ACCELERATOR=cpu, cuda, or rocm; default cpu)
    deps: [build-server-image]
    dotenv: ['.env']
    dir: .
    vars:
      ACCELERATOR: '{{.DEFAULT_ACCELERATOR}}'
      SERVER_IMAGE: '{{default "ghcr.io/shyndman/lmnop-eavesdrop:latest" .SERVER_IMAGE}}'
      LOG_LEVEL: '{{default "INFO" .LOG_LEVEL}}'
    cmds:
      - docker run --interactive --tty
        {{if eq .ACCELERATOR "cuda"}}--gpus all{{end}}
        {{if eq .ACCELERATOR "rocm"}}--device /dev/kfd --device /dev/dri --security-opt seccomp=unconfined{{end}}
        --rm
        --publish '9090:9090'
        --name eavesdrop
        {{if and (eq .ACCELERATOR "rocm") .HSA_OVERRIDE_GFX_VERSION}}--env HSA_OVERRIDE_GFX_VERSION='{{.HSA_OVERRIDE_GFX_VERSION}}'{{end}}
        --env LOG_LEVEL='{{.LOG_LEVEL}}'
        --env LANGFUSE_PUBLIC_KEY
        --env LANGFUSE_SECRET_KEY
        --env LANGFUSE_BASE_URL
        --volume "$HOME/.cache/lmnop/eavesdrop-models:/root/.cache/eavesdrop"
        --volume "$PWD/packages/server/config.yaml:/app/config.yaml:ro"
        --env EAVESDROP_CONFIG=/app/config.yaml
        {{.SERVER_IMAGE}}

  run-server-image-persistent:
    desc: Run the server as a background container (ACCELERATOR=cpu, cuda, or rocm)
    deps: [build-server-image]
    dotenv: ['.env']
    dir: .
    vars:
      ACCELERATOR: '{{.DEFAULT_ACCELERATOR}}'
      SERVER_IMAGE: '{{default "ghcr.io/shyndman/lmnop-eavesdrop:latest" .SERVER_IMAGE}}'
      LOG_LEVEL: '{{default "INFO" .LOG_LEVEL}}'
    cmds:
      - |
        if docker inspect -f '{{"{{"}}.State.Running{{"}}"}}' eavesdrop >/dev/null 2>&1 && [ "$(docker inspect -f '{{"{{"}}.State.Running{{"}}"}}' eavesdrop)" = "true" ]; then
          docker stop eavesdrop
        fi
      - docker rm eavesdrop || true
      - docker run --detach
        {{if eq .ACCELERATOR "cuda"}}--gpus all{{end}}
        {{if eq .ACCELERATOR "rocm"}}--device /dev/kfd --device /dev/dri --security-opt seccomp=unconfined{{end}}
        --restart always
        --publish '9090:9090'
        --name eavesdrop
        {{if and (eq .ACCELERATOR "rocm") .HSA_OVERRIDE_GFX_VERSION}}--env HSA_OVERRIDE_GFX_VERSION='{{.HSA_OVERRIDE_GFX_VERSION}}'{{end}}
        --env LOG_LEVEL='{{.LOG_LEVEL}}'
        --env LANGFUSE_PUBLIC_KEY
        --env LANGFUSE_SECRET_KEY
        --env LANGFUSE_BASE_URL
        --volume "$HOME/.cache/lmnop/eavesdrop-models:/root/.cache/eavesdrop"
        --volume "$PWD/packages/server/config.yaml:/app/config.yaml:ro"
        --env EAVESDROP_CONFIG=/app/config.yaml
        {{.SERVER_IMAGE}}

  stop-server-image:
    desc: Stop the running server container if needed, then remove it
    cmds:
      - |
        if docker inspect -f '{{"{{"}}.State.Running{{"}}"}}' eavesdrop >/dev/null 2>&1 && [ "$(docker inspect -f '{{"{{"}}.State.Running{{"}}"}}' eavesdrop)" = "true" ]; then
          docker stop eavesdrop
        fi
      - docker rm eavesdrop || true
